<script type="module">
// ===== Scriptable の代わり(ブラウザで同じコードを動かすための小さな置きかえ) =====
const DPR = Math.min(3, window.devicePixelRatio || 2);
const QS = new URLSearchParams(location.search);
const THEME = (QS.get("theme") || "").toLowerCase();
const DARK = THEME === "dark" || (THEME !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
class Size { constructor(w, h) { this.width = w; this.height = h; } }
class Point { constructor(x, y) { this.x = x; this.y = y; } }
class Rect { constructor(x, y, w, h) { this.x = x; this.y = y; this.width = w; this.height = h; } }
class Color {

  css() { const h = this.hex.replace("#", ""); const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16); return `rgba(${r},${g},${b},${this.a})`; }

}
const SYS = '-apple-system, "Roboto", "Noto Sans JP", system-ui, sans-serif', MONO = '"Roboto Mono", ui-monospace, Menlo, monospace';

  static boldSystemFont(s) { return new Font(700, s); } static heavySystemFont(s) { return new Font(800, s); }
  static boldRoundedSystemFont(s) { return new Font(700, s); } static semiboldRoundedSystemFont(s) { return new Font(600, s); }

}

  addText(t) { const sp = document.createElement("span"); sp.textContent = t; sp.style.cssText = "white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0"; this.el.appendChild(sp); return { set font(f) { sp.style.font = f.css; }, set textColor(c) { sp.style.color = c.css(); }, set lineLimit(v) { }, set minimumScaleFactor(v) { }, centerAlignText() { sp.style.textAlign = "center"; } }; }

class ListWidget extends WidgetStack { constructor() { super(); this.el.style.flexDirection = "column"; } }
class Request {
  constructor(url) { this.url = url; this.method = "GET"; this.headers = {}; this.body = null; }

}
const Device = { screenSize: () => ({ width: 390 }), isUsingDarkAppearance: () => DARK };
const Keychain = {
  contains: k => { try { return localStorage.getItem("wgk_" + k) != null; } catch (e) { return false; } },
  get: k => { try { return localStorage.getItem("wgk_" + k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { localStorage.setItem("wgk_" + k, v); } catch (e) { } }
};
// 大きさ: ?size=small|medium|large。なければ画面の縦横の比から
const FAM = (() => { const s = (QS.get("size") || "").toLowerCase(); if (["small", "medium", "large"].includes(s)) return s; const r = innerWidth / Math.max(1, innerHeight); return r > 1.45 ? "medium" : innerHeight > 300 && r < 1.2 ? "large" : "small"; })();
const config = { widgetFamily: FAM, runsInWidget: true };
const args = { widgetParameter: [QS.get("me") || "", DARK ? "dark" : "light"].join(",") };
const BASE = { small: [158, 158], medium: [338, 158], large: [338, 354] };
const Script = {
  setWidget(w) {
    const [bw, bh] = BASE[FAM];
    const host = document.getElementById("wg");
    w.el.style.width = bw + "px"; w.el.style.height = bh + "px"; w.el.style.boxSizing = "border-box"; w.el.style.overflow = "hidden";
    host.innerHTML = ""; host.appendChild(w.el);
    const fit = () => { const k = Math.min(innerWidth / bw, innerHeight / bh); w.el.style.transform = `scale(${k})`; w.el.style.transformOrigin = "0 0"; host.style.width = bw * k + "px"; host.style.height = bh * k + "px"; };
    fit(); addEventListener("resize", fit);
    document.body.style.background = w._bg ? w._bg.css() : "";
    document.body.onclick = () => { location.href = w._url || "./"; };
    // 次に描き直す時刻(リング版の決まりと同じ)。ウィジェットのアプリが撮り直すときに新しい絵になるよう、ページも読み直す
    const next = w._refresh ? Math.max(60000, w._refresh - Date.now()) : 15 * 60000;
    setTimeout(() => location.reload(), Math.min(next, 30 * 60000));
  },
  complete() { }
};

// ===== ここから下は scriptable-widget.js と同じ(リング版) =====
// バレー日程アプリ: 今日の予定ウィジェット(Scriptable 用)
// 使い方: Scriptable にこのコードを貼って保存 → ホーム画面かロック画面に Scriptable のウィジェットを置く →
//         ウィジェットを長押し「ウィジェットを編集」→ Script でこのスクリプトを選び、Parameter に
//         アプリの「使い方 → ウィジェット」に出る「あなたの Parameter」を入れる(名前、または 名前#合言葉)
// (自分あての共有予定・自分の出欠・共有をオンにした自分のLocal予定も出ます)
// アカウントを紐付けている名前は、合言葉がないと使えません(名前だけで他の人に成りすませないように)

const APP_URL = "https://248toma.github.io/calendar/";
const API_KEY = "AIzaSyCupZ4RbR9eLzz991by5DFu9lxOsVbjrNg";
const PROJECT = "calendar24884";
const DOC_PATH = "sharedApps/volleyball-schedule";
const KEYS = {
  events: "attendance_events_v3", reservations: "attendance_reservations_v1", byDate: "attendance_bydate_v4",
  plans: "attendance_plans_v2", roster: "attendance_roster_v1", thresholds: "attendance_thresholds_v4"
};
const TOKEN_KEY = "vb_widget_token_v1";
// 見た目: "list" = 予定の板が並ぶ版 / "ring" = アプリの試作UIのヘッダーと同じリング版
const STYLE = "ring";
// リングの時計(アプリの設定「リングの時計」と同じ): "24" = 1周24時間 / "12" = 1周12時間(午前は内側・午後は外側)
const DIAL = "24";
const WD = ["日", "月", "火", "水", "木", "金", "土"];
// 予定の色(アプリの色番号 0〜8)。[ライト, ダーク] はアプリの予定の線の色と同じ
const PCOL = [["#9aa0a8", "#7f848c"], ["#4677c4", "#86aef0"], ["#4677c4", "#86aef0"], ["#e597b7", "#f4c0d5"], ["#1f2124", "#f1f2f4"], ["#9c3d68", "#d0789f"], ["#e597b7", "#f4c0d5"], ["#4677c4", "#86aef0"], ["#9aa0a8", "#7f848c"], ["#1f2124", "#f1f2f4"], ["#9aa0a8", "#7f848c"], ["#9c3d68", "#d0789f"], ["#e597b7", "#f4c0d5"], ["#4677c4", "#86aef0"]];   // 5色(黒・灰色・青・暗いピンク・ピンク)。0〜8 の古い番号も近い色に   // 9〜13: 黒 濃/薄・暗いピンク 濃/薄・紺
// バレーの人数の色(アプリのカレンダーと同じ: 十分=緑 / やや不足=黄 / 不足・多すぎ=赤)
const LV = { sufficient: ["#5d9487", "#7fb5a8"], warning: ["#ad9e72", "#cbbb8c"], danger: ["#b27c85", "#d29aa3"] };

// ===== 共有データを読む(アプリのゲストと同じ匿名ログイン。ログイン情報はキーチェーンに保存して使い回す) =====
async function idToken() {
  let t = null;
  try { if (Keychain.contains(TOKEN_KEY)) t = JSON.parse(Keychain.get(TOKEN_KEY)); } catch (e) { t = null; }
  if (t && t.id && t.exp - Date.now() > 5 * 60 * 1000) return t.id;
  if (t && t.refresh) {
    try {
      const r = new Request("https://securetoken.googleapis.com/v1/token?key=" + API_KEY);
      r.method = "POST";
      r.headers = { "Content-Type": "application/x-www-form-urlencoded" };
      r.body = "grant_type=refresh_token&refresh_token=" + encodeURIComponent(t.refresh);
      const j = await r.loadJSON();
      if (j.id_token) {
        Keychain.set(TOKEN_KEY, JSON.stringify({ id: j.id_token, refresh: j.refresh_token, exp: Date.now() + (+j.expires_in) * 1000 }));
        return j.id_token;
      }
    } catch (e) { /* 取り直す */ }
  }
  const r = new Request("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + API_KEY);
  r.method = "POST";
  r.headers = { "Content-Type": "application/json" };
  r.body = JSON.stringify({ returnSecureToken: true });
  const j = await r.loadJSON();
  if (!j.idToken) throw new Error("ログインできません");
  Keychain.set(TOKEN_KEY, JSON.stringify({ id: j.idToken, refresh: j.refreshToken, exp: Date.now() + (+j.expiresIn) * 1000 }));
  return j.idToken;
}
async function loadShared() {
  const r = new Request(`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/${DOC_PATH}`);
  r.headers = { Authorization: "Bearer " + await idToken() };
  const j = await r.loadJSON();
  const f = (((j.fields || {}).values || {}).mapValue || {}).fields || {};
  const get = (k) => { try { return JSON.parse((f[k] && f[k].stringValue) || "null"); } catch (e) { return null; } };
  return {
    events: get(KEYS.events) || {}, reservations: get(KEYS.reservations) || {}, byDate: get(KEYS.byDate) || {},
    plans: get(KEYS.plans) || [], roster: get(KEYS.roster) || [], thresholds: get(KEYS.thresholds) || {}
  };
}

// ===== 今日の予定を作る =====
function dkey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

// 「名前」または「名前#合言葉」。紐付け済みの名前は合言葉が合わないと使わない(blocked)
let WBLOCK = false;
function resolveMe(data, raw) {
  const m = String(raw || "").match(/^(.*?)(?:#([a-z0-9]+))?$/i);
  const name = (m ? m[1] : "").trim(), key = m && m[2] ? m[2].toLowerCase() : "";
  if (!name) return "";
  const me = (data.roster || []).find(r => r.name === name);
  if (me && me.emailHash) {
    const rec = ((data.byDate || {}).widget || []).find(x => x && x.who === me.id);
    if (!key || !rec || rec.k !== key) { WBLOCK = true; return ""; }
  }
  return name;
}
function itemsFor(data, today, myName, nowMin) {
  const me = myName ? (data.roster || []).find(r => r.name === myName) : null, myId = me ? me.id : null;
  const items = [];
  // バレー
  if (data.events[today]) {
    const rs = data.reservations[today] || [];
    const times = rs.map(r => String(r.time || "").match(/(\d{1,2}:\d{2})\D+(\d{1,2}:\d{2})/)).filter(Boolean);
    const s = times.length ? times.map(x => x[1]).sort((a, b) => hm(a) - hm(b))[0] : "";
    const e = times.length ? times.map(x => x[2]).sort((a, b) => hm(b) - hm(a))[0] : "";

    const come = list.filter(m => m.status === "来る").length;
    const mine = myName ? list.find(m => m.name === myName) : null;

    items.push({ ad: 1, s: hm(s) ?? -1, endM: hm(e) ?? hm(s), t1: s || "終日", t2: e, title: `🏐 Volley · ${come}`, sub: [place, mine ? `自分 ${SYM[mine.status] || "?"}` : ""].filter(Boolean).join("  "), color: LV[lv] });
  }
  const visible = p => !p.to || !p.to.length || (myId != null && p.to.includes(myId));
  const onDay = p => p && p.startDate && p.startDate <= today && (p.endDate ? p.endDate >= today : p.startDate === today);
  const has = p => p.title || p.start || p.end || p.memo || p.endDate;
  const add = (p, local) => {
    const first = p.startDate === today, last = !p.endDate || p.endDate === today, multi = !!p.endDate && p.endDate !== p.startDate;
    const timed = !p.allDay && (p.start || p.end);
    const t1 = first ? (timed && p.start ? p.start : "終日") : md(p.startDate);
    const t2 = multi ? (last ? (p.end || md(p.endDate)) : md(p.endDate)) : (timed ? (p.end || "") : "");
    // 今日で終わる時間のある予定は、終わりの時間(なければ開始の時間)を覚えておく(過ぎたら消す)
    const endM = last && timed ? (hm(p.end) ?? hm(p.start)) : null;
    items.push({ ad: !(first && last) ? 0 : timed ? 3 : 2, s: first && timed ? (hm(p.start) ?? -1) : -1, endM, t1, t2, title: (local ? "📱 " : "") + (p.title || "予定"), sub: p.memo || "", color: PCOL[+p.color || 0] || PCOL[0] });   // color = [ライト, ダーク]
  };
  (data.plans || []).filter(p => !p.local && has(p) && onDay(p) && visible(p)).forEach(p => add(p, false));
  ((data.byDate || {}).pairplans || []).filter(p => p && !p.deleted && has(p) && onDay(p) && visible(p)).forEach(p => add(p, false));
  // 管理者のLocal予定(通知用に共有している分): 自分の分だけ
  // 自分のLocal予定: 管理者の通知用の写し+ウィジェット用に共有をオンにした写し(同じ予定は1つだけ)
  if (myId != null) {
    const seen = new Set();
    const locals = ((data.byDate || {}).localntf || []).filter(x => x.who === myId).concat(((data.byDate || {}).widget || []).filter(x => x && x.who === myId));
    locals.forEach(x => (x.list || []).filter(p => has(p) && onDay(p) && !seen.has(p.id)).forEach(p => { seen.add(p.id); add(p, true); }));
  }
  items.sort((a, b) => a.ad - b.ad || a.s - b.s);
  // 終わった予定は出さない(終日・何日も続く予定は、その日のうちは出したまま)
  const nowM = nowMin == null ? -1 : nowMin;

}
function nextVolley(data, today) {
  return Object.keys(data.events || {}).filter(k => data.events[k] && k > today && /^\d{4}-\d{2}-\d{2}$/.test(k)).sort()[0] || "";
}

// ===== ウィジェット =====
// アプリと同じ色(ライト / ダーク)。予定は一覧と同じ「丸い板」に乗せる
const dyn = (l, d) => Color.dynamic(new Color(l), new Color(d));
const C = {

  bg: dyn("#eceff4", "#1e1e1e"), card: dyn("#ffffff", "#2c2c2e"),   // ライトは白い板(影がないので、背景との差で区切る)
  ink: dyn("#12151c", "#ffffff"), ink2: dyn("#4a5262", "#d1d1d6"), ink3: dyn("#8a93a3", "#8e8e93"),

  const nextKey = sv ? k : Object.keys(data.events || {}).filter(x => data.events[x] && x >= k && /^\d{4}-\d{2}-\d{2}$/.test(x)).sort()[0] || "";
  const vv = nextKey ? volleyOn(data, nextKey, myName) : null;
  // 今日のバレーが終わった(終わりの時刻を過ぎた)ら: 今日のバレーはそのまま、次のバレーを予告(リングの内側の細いリング・「NEXT 7」・「NEXT 11/2 19:00〜」)
  const nowM = now.getHours() * 60 + now.getMinutes();
  const done = sv && sv.s != null && nowM >= (sv.e != null && sv.e > sv.s ? sv.e : sv.s + 120);
  const upKey = done ? Object.keys(data.events || {}).filter(x => data.events[x] && x > k && /^\d{4}-\d{2}-\d{2}$/.test(x)).sort()[0] || "" : "";
  const up = upKey ? volleyOn(data, upKey, myName) : null;
  const w = new ListWidget(); w.url = APP_URL;
  w.backgroundColor = BG_SET ? C.bg : new Color(P.bg);
  const S = fam === "small" ? 126 : fam === "large" ? 132 : 130;
  const dial = drawDial(S, k, data, myName, vv, mode, true, now, up);
  if (fam === "small") {
    w.setPadding(8, 8, 8, 8);
    const r = w.addStack(); r.addSpacer(); const im = r.addImage(dial); im.imageSize = new Size(S, S); r.addSpacer();
    setRefreshRing(w, now, busySpans(data, dkey(now), myName)); return w;
  }
  // 上下・左右とも真ん中に寄せる(リングと文字のかたまりを、ウィジェットの中央に置く)
  w.setPadding(8, 12, 8, 12);
  if (fam !== "large") w.addSpacer();
  const top = w.addStack(); top.centerAlignContent();
  top.addSpacer(8);   // リングは少し左寄り(右の余りは文字の後ろへ)
  const im = top.addImage(dial); im.imageSize = new Size(S, S);
  top.addSpacer(18);
  const col = top.addStack(); col.layoutVertically();
  // 日付
  const dl = col.addStack(); dl.bottomAlignContent();
  const d1 = dl.addText(`${now.getMonth() + 1}/${now.getDate()}`); d1.font = Font.boldRoundedSystemFont(15); d1.textColor = new Color(P.ink);
  dl.addSpacer(5);
  const d2 = dl.addText(WEN3[now.getDay()]); d2.font = Font.semiboldSystemFont(10); d2.textColor = new Color(P.ink3);
  const plans = plansOnDay(data, k, myName);
  if (plans.some(x => x.p.holiday)) { dl.addSpacer(6); const hl = dl.addText("休日"); hl.font = Font.systemFont(10); hl.textColor = new Color(P.red); }
  col.addSpacer(6);
  // 次のバレー + 自分の出欠
  if (vv) {
    const vl = col.addStack(); vl.centerAlignContent();
    const a = vl.addText(sv ? "VOLLEY" : `NEXT ${md(nextKey)}`); a.font = Font.boldSystemFont(11); a.textColor = new Color(P.ink);
    vl.addSpacer(6);
    const b = vl.addText(vv.s != null ? `${fmtM(vv.s)}〜` : "時間未定"); b.font = Font.mediumSystemFont(11); b.textColor = new Color(P.ink3);
    if (vv.mine) {
      vl.addSpacer(6);
      const AC = { "来る": LVc.sufficient, "未定": LVc.warning, "来ない": LVc.danger };
      const m = vl.addText(SYM[vv.mine] || "?"); m.font = Font.boldSystemFont(11); m.textColor = new Color(AC[vv.mine] || P.ink3);
    }
    col.addSpacer(6);
  }
  if (up) {   // 次のバレーの予告
    const ul = col.addStack(); ul.centerAlignContent();
    const a = ul.addText("NEXT"); a.font = Font.boldSystemFont(10); a.textColor = new Color(P.ink2);
    ul.addSpacer(5);
    const b = ul.addText(`${md(upKey)}${up.s != null ? ` ${fmtM(up.s)}〜` : ""}`); b.font = Font.mediumSystemFont(10); b.textColor = new Color(P.ink3);
    col.addSpacer(6);
  }
  // 予定(バレーも入れる)
  const rows = plans.map(({ p, first, last, multi }) => {
    const s0 = hm(p.start), e0 = hm(p.end);
    const timed = !p.allDay && s0 != null && (first || !multi);
    const endsHere = multi && last && !first && !p.allDay && e0 != null;
    return { t: timed ? p.start : endsHere ? `〜${p.end}` : "終日", title: p.title || "予定", col: PC[+p.color || 0] || PC[0], min: timed ? s0 : endsHere ? -0.5 : -1 };
  });
  if (sv) rows.push({ t: sv.s != null ? fmtM(sv.s) : "—", title: "バレー", col: P.ink2, min: sv.s != null ? sv.s : 0 });
  rows.sort((a, b) => a.min - b.min);
  const max = up && fam !== "large" ? 2 : 3;   // 予告の行が入るときは、予定は2つまで(はみ出さないように)
  if (!rows.length) { const t = col.addText("予定なし"); t.font = Font.systemFont(11.5); t.textColor = new Color(P.ink3); }
  rows.slice(0, max).forEach((r, i) => {
    if (i) col.addSpacer(4);
    const line = col.addStack(); line.centerAlignContent();
    const dot = line.addStack(); dot.size = new Size(7, 7); dot.cornerRadius = 3.5; dot.backgroundColor = new Color(r.col);
    line.addSpacer(7);
    const tt = line.addText(r.t); tt.font = Font.semiboldMonospacedSystemFont(11); tt.textColor = new Color(P.ink2); tt.lineLimit = 1;
    line.addSpacer(7);
    const ti = line.addText(r.title); ti.font = Font.boldSystemFont(12.5); ti.textColor = new Color(P.ink); ti.lineLimit = 1;
  });
  if (rows.length > max) { col.addSpacer(3); const m = col.addText(`+${rows.length - max}`); m.font = Font.boldSystemFont(10); m.textColor = new Color(P.ink3); }
  top.addSpacer();
  // 大: 下に残りの予定も並べる
  if (fam === "large" && rows.length > max) {
    w.addSpacer(10);
    rows.slice(max, max + 8).forEach(r => {
      const line = w.addStack(); line.centerAlignContent();
      const dot = line.addStack(); dot.size = new Size(7, 7); dot.cornerRadius = 3.5; dot.backgroundColor = new Color(r.col);
      line.addSpacer(8);
      const tt = line.addText(r.t); tt.font = Font.semiboldMonospacedSystemFont(11); tt.textColor = new Color(P.ink2);
      line.addSpacer(8);
      const ti = line.addText(r.title); ti.font = Font.boldSystemFont(13); ti.textColor = new Color(P.ink); ti.lineLimit = 1;
      w.addSpacer(5);
    });
  }
  if (WBLOCK) { w.addSpacer(4); const bl = w.addText("⚠︎ この名前は合言葉が必要です"); bl.font = Font.systemFont(9); bl.textColor = new Color(P.ink3); }
  w.addSpacer();
  setRefreshRing(w, now, busySpans(data, dkey(now), myName));
  return w;
}

async function main() {
  // 名前: ウィジェットの Parameter。アプリ内で実行するときは、前にウィジェットで使った名前(またはここで入れた名前)を使う
  // Parameter: 「名前」または「名前,dark」「名前,light」
  const prm = String(args.widgetParameter || "").split(/[,、，]/).map(x => x.trim());
  let myName = prm[0] || "";
  if (/^(dark|light)$/i.test(prm[1] || "")) setNeuMode(prm[1].toLowerCase());
  if (/^#?[0-9a-f]{6}$/i.test(prm[2] || "")) { C.bg = new Color(prm[2].replace(/^#?/, "#")); BG_SET = true; }   // 3つ目: 背景の色(壁紙の色)
  if (myName) Keychain.set("vb_widget_name", myName);
  else if (!config.runsInWidget) {
    const saved = Keychain.contains("vb_widget_name") ? Keychain.get("vb_widget_name") : "";
    const a = new Alert(); a.title = "名簿の自分の名前"; a.message = "アプリの「使い方→ウィジェット」に出る Parameter(名前、または 名前#合言葉)"; a.addTextField("例: たろう", saved); a.addAction("OK"); a.addCancelAction("名前なし");
    if (await a.present() === 0) { myName = a.textFieldValue(0).trim(); if (myName) Keychain.set("vb_widget_name", myName); }
  } else myName = Keychain.contains("vb_widget_name") ? Keychain.get("vb_widget_name") : "";
  let w;
  try {
    const data = await loadShared();
    w = (STYLE === "ring" ? buildRing : build)(data, new Date(), resolveMe(data, myName));
  } catch (e) {
    w = new ListWidget(); w.backgroundColor = C.bg; w.url = APP_URL;
    const t = w.addText("予定を読み込めませんでした"); t.font = Font.mediumSystemFont(12); t.textColor = C.ink2;
    const d = w.addText(String(e && e.message || e)); d.font = Font.systemFont(9); d.textColor = C.ink3;
  }
  if (config.runsInWidget) Script.setWidget(w);
  else await w.presentMedium();   // アプリの中で実行したときは見本を表示
  Script.complete();
}
await main();

</script>
